plugins {
    id 'maven-publish'
    id 'org.springframework.boot' version '4.1.1'
    id "org.sonarqube" version "7.5.0.8588"
}

repositories {
    mavenCentral()
}

apply plugin: 'java'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'jacoco'

/*
    The Apache Tomcat 11.0.24 is included in the Spring Boot 4.1.1 which has a vulnerability CVE-2026-32990 (Improper Input Validation).
    To fix it is recommended to upgrade to version 11.0.25. In future when Spring Boot version is upgraded then below line can be removed.
*/
ext['tomcat.version'] = '11.0.25'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

group = 'uk.gov.cslearning'
version = '0.1.0-' + (System.getenv('TRAVIS_COMMIT') ?: 'local')

bootJar {
    archiveFileName = 'learning-catalogue.jar'
    mainClass.set('uk.gov.cslearning.catalogue.Application')
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jersey'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'com.mysql:mysql-connector-j:26.7.0'
    implementation 'org.flywaydb:flyway-mysql:13.10.3'
    implementation 'co.elastic.clients:elasticsearch-java'

    implementation 'org.hibernate.orm:hibernate-core'

    implementation('org.springframework.boot:spring-boot-starter-data-elasticsearch') {
        exclude module: 'log4j-api'
    }

    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.google.guava:guava:33.7.2-jre'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'com.microsoft.azure:azure-storage:8.6.6'
    implementation 'org.apache.tika:tika-core:4.1.0'
    implementation 'org.apache.tika:tika-parsers:4.1.0'

    implementation 'com.microsoft.azure:applicationinsights-web-auto:2.6.4'
    implementation 'com.microsoft.azure:applicationinsights-logging-logback:2.6.4'
    implementation 'com.microsoft.azure:applicationinsights-spring-boot-starter:2.6.4'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'com.h2database:h2:2.5.252'
    testImplementation 'com.google.code.gson:gson:2.14.0'

    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'net.bytebuddy:byte-buddy:1.18.15'
    testImplementation 'com.jayway.jsonpath:json-path:3.0.0'
    testImplementation 'org.testcontainers:elasticsearch:1.21.4'
}

test {
    useJUnitPlatform()
}

compileJava.dependsOn(processResources)

logging:
  level:
    root: TRACE
elasticsearch:
  repositories:
    courses:
      indexName: "testcourses"
spring:
  main:
    allow-bean-definition-overriding: true
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  flyway:
    locations: classpath:db/migration/{vendor}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    url: jdbc:h2:mem:learning_catalogue;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
  h2:
    console:
      enabled: true
      path: "/h2-console"

database:
  host: ${DATABASE_HOST:jdbc:mysql://localhost:3306}
  name: ${DATABASE_NAME:learning_catalogue}
  use-ssl: ${DATABASE_USESSL:false}
spring:
  main:
    allow-bean-definition-overriding: ${SPRING_MAIN_ALLOW_BEAN_OVERRIDING:false}
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DATASOURCE_URL:${database.host}/${database.name}?useSSL=${database.use-ssl}&requireSSL=false}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:my-secret-pw}
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:true}
  sql:
    init:
      platform: mysql
  flyway:
    locations: classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 5120MB
      max-request-size: 5120MB
  security:
    oauth2:
      resource:
        jwt:
          key-value: ${JWT_KEY:key}
      client:
        registration:
          identity-service:
            client-id: ${CLIENT_ID:9fbd4ae2-2db3-44c7-9544-88e80255b56e}
            client-secret: ${CLIENT_SECRET:test}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          identity-service:
            authorization-uri: ${identity.authorizationUrl}
            token-uri: ${identity.tokenUrl}
      refresh:
        service-token-cache:
          before-seconds-to-expire: ${REFRESH_SERVICETOKENCACHE_BEFORE_SECONDS_TOEXPIRE:0}

time:
  zoneId: ${TIME_ZONE_ID:UTC}
server:
  port: 9001

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ${ROOT_LOGGING_LEVEL:INFO}
    uk.gov.cslearning: ${UK_GOV_CSLEARNING_LOGGING_LEVEL:INFO}
    com.zaxxer.hikari: ERROR
    org:
      springframework:
        data:
          elasticsearch:
            core: ${ROOT_LOGGING_LEVEL:INFO}

elasticsearch:
  protocol: ${ES_PROTOCOL:http}
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  username: ${ELASTICSEARCH_USERNAME:elastic}
  password: ${ELASTICSEARCH_PASSWORD:changeme}
  readTimeout: ${ELASTICSEARCH_READ_TIMEOUT:10000}
  repositories:
    courses:
      indexName: "courses"

rustici:
  e-learning-manifests: ${ELEARNING_MANIFESTS:imsmanifest.xml,tincan.xml}
  url: ${RUSTICI_URL:http://csl.local/rustici}
  api-url: "${rustici.url}/RusticiEngine/api/v2"
  username: ${RUSTICI_USERNAME:apiuser}
  password: ${RUSTICI_PASSWORD:password}
  tenant: ${RUSTICI_TENANT:default}

azure:
  account:
    name: ${AZURE_ACCOUNT_NAME:devstoreaccount1}
    key: ${AZURE_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==}
  storage:
    container: ${AZURE_STORAGE_CONTAINER:lpgdevcontent}
    scorm-container: ${AZURE_STORAGE_SCORM_CONTAINER:rustici}
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=${azure.account.name};AccountKey=${azure.account.key}}
  scorm-cdn: "${rustici.url}/cdn"

management:
  endpoints:
    web:
      exposure:
        include: '*'
      cors:
        allowed-origins: "*"
        allowed-methods: "GET, PUT, POST, DELETE, OPTIONS"

record:
  serviceUrl: ${LEARNER_RECORD_URL:http://localhost:9000}
  eventUrlFormat: "/event/%s"
  bulkEventsUrl: "/events-list"
  bookingUrlFormat: "${record.eventUrlFormat}/booking"

registry:
  serviceUrl: ${REGISTRY_SERVICE_URL:http://localhost:9002}
  getCivilServant: "/civilServants/me"

identity:
  serviceUrl: ${OAUTH_SERVICE_URL:http://localhost:8080}
  tokenEndpoint: ${OAUTH_TOKEN_ENDPOINT:/oauth2/token}
  tokenUrl: "${identity.serviceUrl}${identity.tokenEndpoint}"
  authorizationEndpoint: ${OAUTH_AUTHORIZATION_ENDPOINT:/oauth2/authorize}
  authorizationUrl: "${identity.serviceUrl}${identity.authorizationEndpoint}"

retention:
  timeInDays: ${RETENTION_TIME_IN_DAYS:90}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

trigger:
  branches:
    include:
      - master
      - idt-develop
      - idt-feature-LC-*
      - idt-release-v*
      - idt-hotfix-v*
  tags:
    include:
      - '*'

variables:
  - name: acr_repo_suffix
    ${{ if startsWith(variables['Build.SourceBranch'], 'refs/tags') }}:
      value: 'prod'
    ${{ else }}:
      value: 'test'

name: '$(SourceBranchName)-$(Rev:r)'

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      sudo apt-get update -y
      sudo apt-get install -y openjdk-8-jdk
      echo "##vso[task.setvariable variable=JAVA_HOME]/usr/lib/jvm/java-8-openjdk-amd64"
      echo "##vso[task.setvariable variable=JAVA_HOME_8_X64]/usr/lib/jvm/java-8-openjdk-amd64"
      echo "##vso[task.prependpath]/usr/lib/jvm/java-8-openjdk-amd64/bin"
    displayName: 'Install OpenJDK 8'

  - task: Gradle@3
    inputs:
      gradleWrapperFile: 'gradlew'
      jdkVersionOption: '1.8'
      javaHomeOption: 'JDKVersion'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: false
      testResultsFiles: 'build/test-results/**/TEST-*.xml'
      tasks: 'clean build'
    env:
      RUN_INTEGRATION_TESTS: "false"
    displayName: 'Install Gradle and Java 8 and build'

  - task: Docker@2
    inputs:
      containerRegistry: 'lpgregistry ACR'
      repository: 'lpg-learning-catalogue/${{ variables.acr_repo_suffix }}'
      command: 'buildAndPush'
      Dockerfile: '**/Dockerfile'
      tags: '$(Build.SourceBranchName)'

